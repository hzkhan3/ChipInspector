data:
  raw_dir: data/raw/real   # contains DatasetA-Real/ and DatasetB-Real/ (see README "Get the data")
  splits_dir: data/splits
  val_size: 0.15
  test_size: 0.15
  seed: 42

train:
  image_size: 224
  batch_size: 32
  epochs: 10
  lr: 0.0001

model:
  path: models/best_model.pt
  # Pretrained weights for the demo (python -m scripts.download_model)
  url: https://github.com/hzkhan3/ChipInspector/releases/download/v1.0/best_model.pt
  sha256: 0c215726873c003322099d3b02479b0bf0f0158cf7357443e33544315e499432
  threshold: 0.2   # P(defective) >= this -> "defective". Cost-optimal on val for a miss = 1-5 false alarms (scripts.tune_threshold)
