data:
  raw_dir: data/raw/real   # contains DatasetA-Real/ and DatasetB-Real/ (see README "Get the data")
  splits_dir: data/splits
  val_size: 0.15
  test_size: 0.15
  seed: 42

train:
  image_size: 224
  batch_size: 32
  epochs: 10
  seed: 42    # torch seed: new head init, shuffling, augmentation (data.seed fixes the split)
  lr: 0.0001
  lr_schedule: none   # "none" = constant lr (v1.1); "cosine" = decay to 0 over the epochs (tried: smoother, not better, see README)

model:
  path: models/best_model.pt
  # Pretrained weights for the demo (python -m scripts.download_model)
  url: https://github.com/hzkhan3/ChipInspector/releases/download/v1.1/best_model.pt
  sha256: c05d3a1cd634d2cd2441d5452b98c0678a642d397781b1fc49a0b73da8bf7f08
  threshold: 0.32  # P(defective) >= this -> "defective". Cost-optimal on val for a miss = 2-5 false alarms (scripts.tune_threshold)
